
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Web Storage - Dark Mode</title>

    <style type="text/css">
        @import url('https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600&display=swap');

        /* LIGHT MODE */
        body {
            font-family: 'Josefin Sans', sans-serif;
            background-color: #EAF4FF;
            color: #173B67;
            transition: .4s;
        }

        .label {
            display: block;
            text-align: center;
        }

        .label h3 {
            color: #173B67;
            transition: .4s;
        }

        .tulisan {
            text-align: center;
            margin: auto;
            border: 2px solid #4A90E2;
            width: 50%;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #D6E9FF;
            border-radius: 10px;
            padding: 10px;
        }

        /* SWITCH TOGGLE */
        .switch {
            position: relative;
            display: inline-block;
            width: 60px;
            height: 34px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #A9C9ED;
            transition: .4s;
            border-radius: 34px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 26px;
            width: 26px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: .4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background-color: #2196F3;
        }

        input:focus + .slider {
            box-shadow: 0 0 1px #2196F3;
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        /* DARK MODE */
        body.dark-mode {
            background-color: #101D35;
            color: #D8E9FF;
        }

        body.dark-mode .tulisan {
            background-color: #1B3154;
            border-color: #4DA3FF;
            color: #EAF4FF;
        }

        body.dark-mode .label h3 {
            color: #D8E9FF;
        }

        body.dark-mode .slider {
            background-color: #365477;
        }

        body.dark-mode input:checked + .slider {
            background-color: #2196F3;
        }

    </style>
</head>

<body>

    <!-- TULISAN UTAMA -->
    <div class="tulisan">
        <h1>Universitas Sebelas Maret</h1>
        <h2>Pendidikan Teknik Informatika dan Komputer</h2>
    </div>

    <!-- TOGGLE DARK MODE -->
    <div class="label">
        <h3 id="judulTema">Dark Mode</h3>

        <label class="switch">
            <input type="checkbox" id="darkToggle">
            <span class="slider"></span>
        </label>
    </div>

    <!-- JAVASCRIPT LOCAL STORAGE -->
    <script type="text/javascript">

        const toggle = document.getElementById('darkToggle');
        const judulTema = document.getElementById('judulTema');

        // Mengambil tema dari Local Storage
        const temaTersimpan = localStorage.getItem('tema');

        // Memeriksa tema saat halaman dibuka
        if (temaTersimpan === 'dark') {
            toggle.checked = true;
        }

        // Fungsi mengubah tema
        function ubahTampilan() {

            if (toggle.checked) {
                document.body.classList.add('dark-mode');

                localStorage.setItem('tema', 'dark');

                judulTema.textContent = 'Dark Mode';

            } else {
                document.body.classList.remove('dark-mode');

                localStorage.setItem('tema', 'light');

                judulTema.textContent = 'Light Mode';
            }

        }

        // Menyesuaikan tampilan saat halaman dibuka
        ubahTampilan();

        // Menjalankan fungsi ketika toggle diklik
        toggle.addEventListener('change', ubahTampilan);

    </script>

</body>
</html>
