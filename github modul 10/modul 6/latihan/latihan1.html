
<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sederhana</title>

    <style>

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #f0f8ff, #b8dcff, #dceeff);
}

.calculator {
    width: 390px;
    max-width: calc(100% - 32px);
    padding: 40px 30px 50px;
    background: #ffffff;
    border: 1px solid #c5e1ff;
    border-radius: 24px;
    box-shadow: 0 12px 30px rgba(45, 120, 200, 0.15);
}

h1 {
    margin: 10px 0 32px;
    color: #2878c8;
    font-size: 24px;
    text-align: center;
}

input {
    width: 100%;
    padding: 12px;
    margin-bottom: 14px;
    border: 2px solid #cfe5ff;
    border-radius: 11px;
    outline: none;
    background: #f4f9ff;
    color: #245b91;
    font-size: 14px;
}

input:focus {
    border-color: #6aabf5;
}

.buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 14px;
}

button {
    padding: 13px 8px;
    border: none;
    border-radius: 11px;
    background: linear-gradient(135deg, #75baff, #367fe0);
    color: white;
    font-size: 14px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

button:hover {
    background: #2468c5;
    transform: translateY(-2px);
}

#hasil {
    margin-top: 24px;
    padding: 16px 10px;
    border-radius: 12px;
    background: #e5f1ff;
    color: #2878c8;
    font-size: 20px;
    font-weight: bold;
    text-align: center;
    overflow-wrap: anywhere;
}    </style>
</head>

<body>
    <div class="calculator">
        <h1>Kalkulator Sederhana</h1>

        <input
            type="number"
            id="angka1"
            placeholder="Angka pertama"
        >

        <input
            type="number"
            id="angka2"
            placeholder="Angka kedua"
        >

        <div class="buttons">
            <button onclick="hitung('+')">Jumlah (+)</button>
            <button onclick="hitung('-')">Kurang (-)</button>
            <button onclick="hitung('*')">Kali (×)</button>
            <button onclick="hitung('/')">Bagi (÷)</button>
        </div>

        <div id="hasil">Hasil: -</div>
    </div>

    <script>
        function hitung(operator) {
            let angka1 = document.getElementById("angka1").value;
            let angka2 = document.getElementById("angka2").value;
            let hasilElement = document.getElementById("hasil");

            if (angka1 === "" || angka2 === "") {
                hasilElement.textContent = "Masukkan kedua angka!";
                return;
            }

            angka1 = parseFloat(angka1);
            angka2 = parseFloat(angka2);

            let hasil;

            switch (operator) {
                case "+":
                    hasil = angka1 + angka2;
                    break;

                case "-":
                    hasil = angka1 - angka2;
                    break;

                case "*":
                    hasil = angka1 * angka2;
                    break;

                case "/":
                    if (angka2 === 0) {
                        hasilElement.textContent =
                            "Tidak bisa dibagi dengan nol!";
                        return;
                    }

                    hasil = angka1 / angka2;
                    break;
            }

            hasilElement.textContent = "Hasil: " + hasil;
        }
    </script>
</body>
</html>
